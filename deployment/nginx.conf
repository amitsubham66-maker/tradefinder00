# =========================================
# TRADEFINDER AI - NGINX CONFIG
# =========================================

worker_processes auto;

events {

    worker_connections 4096;
}

http {

    include       mime.types;

    default_type  application/octet-stream;

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    gzip on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # =====================================
    # RATE LIMITING
    # =====================================

    limit_req_zone
        $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;

    # =====================================
    # UPSTREAM BACKEND SERVERS
    # =====================================

    upstream backend_servers {

        least_conn;

        server backend:5000;

        # Add more backend nodes later
        # server backend2:5000;
        # server backend3:5000;
    }

    # =====================================
    # WEBSOCKET UPGRADE
    # =====================================

    map $http_upgrade $connection_upgrade {

        default upgrade;

        '' close;
    }

    # =====================================
    # MAIN SERVER
    # =====================================

    server {

        listen 80;

        server_name localhost;

        # =================================
        # FRONTEND
        # =================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files
                $uri
                $uri/
                /index.html;
        }

        # =================================
        # STATIC CACHE
        # =================================

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {

            expires 30d;

            add_header Cache-Control "public";
        }

        # =================================
        # API PROXY
        # =================================

        location /api/ {

            limit_req
                zone=api_limit
                burst=20
                nodelay;

            proxy_pass
                http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header
                Host $host;

            proxy_set_header
                X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;

            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;
        }

        # =================================
        # WEBSOCKET ROUTING
        # =================================

        location /ws/ {

            proxy_pass
                http://backend_servers;

            proxy_http_version 1.1;

            proxy_set_header
                Upgrade $http_upgrade;

            proxy_set_header
                Connection $connection_upgrade;

            proxy_set_header
                Host $host;

            proxy_read_timeout 86400;
        }

        # =================================
        # SECURITY HEADERS
        # =================================

        add_header X-Frame-Options "SAMEORIGIN";

        add_header X-Content-Type-Options "nosniff";

        add_header X-XSS-Protection "1; mode=block";

        add_header Referrer-Policy
            "strict-origin-when-cross-origin";

        # =================================
        # ERROR PAGES
        # =================================

        error_page 500 502 503 504
            /50x.html;

        location = /50x.html {

            root /usr/share/nginx/html;
        }
    }

    # =====================================
    # HTTPS SERVER (ENABLE LATER)
    # =====================================

    # server {
    #
    #     listen 443 ssl;
    #
    #     ssl_certificate
    #         /etc/nginx/ssl/fullchain.pem;
    #
    #     ssl_certificate_key
    #         /etc/nginx/ssl/privkey.pem;
    #
    # }
}